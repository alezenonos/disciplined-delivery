name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The checks live in scripts/checks.sh, one group per job, so local CI (scripts/ci_local.sh)
# runs exactly what runs here. A step here installs tools or calls that script, nothing else
# (tests/test_ci_local.py enforces it).
jobs:
  quality:
    name: Lint & unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff), unit tests and example tests with their coverage gates
        run: scripts/checks.sh quality

  manifests:
    name: Validate manifests, skills & shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      # Pinned like every other tool. Dependabot cannot see a version in a run line, so this
      # pin is bumped by hand: check `npm view @anthropic-ai/claude-code version` when cutting
      # a release. (2.1.322 was the latest on 2026-11-10.)
      - name: Install the Claude Code CLI (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Manifests, skill frontmatter, eval cases, shellcheck, claude plugin validate
        run: scripts/checks.sh manifests

  scaffold:
    name: Scaffold generator self-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate an app, compile it, re-run idempotently, lint and test it
        run: scripts/checks.sh scaffold
