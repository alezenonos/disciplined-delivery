name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint & unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: pip install ruff pytest pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest) with coverage gate
        # COVERAGE_PROCESS_START makes coverage instrument the subprocesses the
        # tests spawn; the threshold lives in [tool.coverage.report] in pyproject.
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: pytest -q --cov --cov-report=term-missing
      - name: Example tests with coverage gate
        run: pytest -q --cov=roman --cov=cli --cov-report=term-missing --cov-fail-under=100
        working-directory: examples/roman-numerals

  manifests:
    name: Validate manifests, skills & shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate plugin/marketplace manifests and skill frontmatter
        run: python scripts/validate_manifests.py
      - name: Validate skill eval cases
        run: python scripts/check_evals.py
      - name: Shellcheck the shell scripts
        run: shellcheck install.sh scripts/ci_local.sh skills/disciplined-delivery/assets/ci_local.sh

  scaffold:
    name: Scaffold generator self-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate an app from the scaffold
        run: python skills/scaffold-agentic-app/scaffold.py "$RUNNER_TEMP/app"
      - name: Compile generated stubs
        run: python -m compileall -q "$RUNNER_TEMP/app"
      - name: Re-run must be idempotent (nothing overwritten)
        run: |
          python skills/scaffold-agentic-app/scaffold.py "$RUNNER_TEMP/app" | tee rerun.log
          grep -q "created: 0 file(s)" rerun.log
      - name: Install generated app deps and run its tests
        run: |
          cd "$RUNNER_TEMP/app"
          pip install -r requirements.txt
          pytest -q
